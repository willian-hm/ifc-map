<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>IFC Campus Videira • Mapa 2D Pixel Art</title>
<style>
  :root{
    --bg:#0d0d12; --panel:rgba(13,13,18,.88);
    --purple:#8b5cf6; --purple-soft:rgba(139,92,246,.38);
    --green:#10b981; --green-soft:rgba(16,185,129,.35);
    --text:#ececf4; --muted:#9b9bb4;
    --font:'Poppins','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    --mono:'Press Start 2P','VT323',ui-monospace,'Courier New',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);
    -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  #game{position:fixed;inset:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair}
  .panel{background:var(--panel);border:1px solid var(--purple-soft);border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

  /* Marca */
  #brand{position:fixed;top:14px;left:14px;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;z-index:5}
  .ifc-logo{display:grid;grid-template-columns:repeat(3,6px);grid-template-rows:repeat(4,6px);gap:2px}
  .ifc-logo span{background:var(--green);border-radius:1px}
  .ifc-logo span.r{background:#e11d48;border-radius:50%}
  .ifc-logo span.e{background:transparent}
  #brand .t1{font-weight:700;font-size:13px;letter-spacing:.3px}
  #brand .t2{font-size:9.5px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;font-family:var(--mono)}

  /* Indicador de local */
  #location{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:9px 18px;display:flex;align-items:center;
    gap:10px;font-size:13px;z-index:5;white-space:nowrap;max-width:calc(100vw - 560px);overflow:hidden;text-overflow:ellipsis}
  #location .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green-soft);
    animation:pulse 1.8s infinite;flex:none}
  #location .lbl{color:var(--muted)}
  #location b{color:#fff;font-weight:600}
  #location.near{border-color:rgba(16,185,129,.6)}
  #location.near .lbl{color:var(--green)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}70%{box-shadow:0 0 0 9px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

  /* Minimapa */
  #minimap-wrap{position:fixed;top:14px;right:14px;padding:8px;z-index:5}
  #minimap-wrap .head{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:9.5px;
    letter-spacing:1.5px;color:var(--muted);margin:0 2px 6px}
  #minimap-wrap .head span:first-child{color:var(--purple);font-weight:700}
  #minimap{display:block;border-radius:8px;border:1px solid rgba(255,255,255,.08);image-rendering:auto}

  /* Barra de ferramentas */
  #toolbar{position:fixed;top:66px;left:14px;display:flex;gap:6px;z-index:5;flex-wrap:wrap;max-width:300px}
  #toolbar button{font-family:var(--font);font-size:11.5px;color:var(--text);background:var(--panel);border:1px solid var(--purple-soft);
    border-radius:9px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s}
  #toolbar button:hover{border-color:var(--purple);transform:translateY(-1px)}
  #toolbar button.on{background:rgba(139,92,246,.22);border-color:var(--purple);color:#fff}
  #toolbar button.on.green{background:rgba(16,185,129,.2);border-color:var(--green)}
  kbd{font-family:var(--mono);font-size:9.5px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
    border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:#d9d9e6}

  /* Ajuda */
  #help{position:fixed;left:14px;bottom:14px;padding:12px 14px;font-size:12px;z-index:5;min-width:230px}
  #help h4{font-size:10px;font-family:var(--mono);letter-spacing:1.6px;color:var(--purple);margin-bottom:8px;text-transform:uppercase}
  #help .row{display:flex;justify-content:space-between;gap:16px;padding:3px 0;color:var(--muted)}
  #help .row span:last-child{color:var(--text)}
  #help.hidden{display:none}

  /* Cartão de interação */
  #interact{position:fixed;left:50%;bottom:22px;transform:translate(-50%,24px);opacity:0;pointer-events:none;
    padding:12px 18px 13px;min-width:280px;max-width:min(520px,calc(100vw - 28px));z-index:6;transition:.22s ease;
    border-color:rgba(16,185,129,.55)}
  #interact.show{opacity:1;transform:translate(-50%,0)}
  #interact .tag{font-family:var(--mono);font-size:9px;letter-spacing:1.8px;color:var(--green);margin-bottom:4px;display:flex;align-items:center;gap:6px}
  #interact .tag::before{content:'';width:7px;height:7px;background:var(--green);display:inline-block}
  #interact .name{font-size:16px;font-weight:700;color:#fff}
  #interact .desc{font-size:12.5px;color:#c4c4d6;margin-top:3px;line-height:1.45}
  #interact .bar{height:2px;margin-top:9px;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--purple))}

  #debug-badge{position:fixed;top:66px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;letter-spacing:1.5px;
    padding:5px 10px;border-radius:8px;background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.55);color:#fca5a5;z-index:5;display:none}
  #debug-badge.show{display:block}

  /* Carregamento */
  #loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:50;transition:opacity .4s}
  #loading.hide{opacity:0;pointer-events:none}
  #loading .bar{width:220px;height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
  #loading .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--green),var(--purple));animation:load 1s infinite ease-in-out}
  #loading p{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--muted)}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

  @media (max-width:900px){
    #location{top:auto;bottom:14px;left:14px;transform:none;max-width:calc(100vw - 28px);font-size:12px}
    #help{display:none}
    #interact{bottom:66px}
    #toolbar{max-width:200px}
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="brand" class="panel">
  <div class="ifc-logo"><span class="r"></span><span></span><span class="e"></span><span></span><span></span><span></span><span></span><span></span><span class="e"></span><span></span><span></span><span></span></div>
  <div><div class="t1">IFC • Campus Videira</div><div class="t2">Pixel Map 16-bit</div></div>
</div>

<div id="location" class="panel"><span class="dot"></span><span class="lbl" id="loc-label"></span><b id="loc-name">Caminhando pelo Campus</b></div>

<div id="minimap-wrap" class="panel">
  <div class="head"><span>MAPA</span><span id="coords">0 , 0</span></div>
  <canvas id="minimap"></canvas>
</div>

<div id="toolbar">
  <button id="btn-hitbox" title="Mostrar hitboxes de colisão">Hitbox <kbd>H</kbd></button>
  <button id="btn-run" title="Alternar corrida (mobile)">Correr <kbd>Shift</kbd></button>
  <button id="btn-help" title="Mostrar/ocultar ajuda">Ajuda</button>
</div>

<div id="help" class="panel">
  <h4>Controles</h4>
  <div class="row"><span>Mover</span><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / Setas</span></div>
  <div class="row"><span>Correr</span><span><kbd>Shift</kbd></span></div>
  <div class="row"><span>Andar até um ponto</span><span>Clique / Toque</span></div>
  <div class="row"><span>Hitboxes (debug)</span><span><kbd>H</kbd> ou <kbd>C</kbd></span></div>
  <div class="row"><span>Zoom</span><span><kbd>+</kbd> <kbd>−</kbd></span></div>
  <div class="row"><span>Minimapa</span><span><kbd>M</kbd></span></div>
</div>

<div id="interact" class="panel">
  <div class="tag">PRÓXIMO À ENTRADA</div>
  <div class="name" id="int-name">—</div>
  <div class="desc" id="int-desc">—</div>
  <div class="bar"></div>
</div>

<div id="debug-badge">DEBUG • HITBOXES VISÍVEIS</div>

<div id="loading"><div class="ifc-logo" style="transform:scale(2)"><span class="r"></span><span></span><span class="e"></span><span></span><span></span><span></span><span></span><span></span><span class="e"></span><span></span><span></span><span></span></div><div class="bar"><i></i></div><p>GERANDO O CAMPUS EM PIXEL ART...</p></div>

<script>
(() => {
'use strict';

/* =========================================================================
   1. CONSTANTES E UTILITÁRIOS
   ========================================================================= */
const W = 2400, H = 1600;               // Tamanho do mundo em pixels

// Gerador pseudoaleatório determinístico (o mapa é sempre igual)
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function hash1(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash1(i) * (1 - u) + hash1(i + 1) * u; }

function hexToRgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), 255]; }
const C = hexToRgb;
function rgbStr(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function shade(c, f) { return [clamp(Math.round(c[0] * f), 0, 255), clamp(Math.round(c[1] * f), 0, 255), clamp(Math.round(c[2] * f), 0, 255), c.length > 3 ? c[3] : 255]; }
function mix(a, b, t) { return [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t), 255]; }

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function bayer(x, y) { return BAYER[(y & 3) * 4 + (x & 3)] / 16; }

function makeCanvas(w, h, willRead) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
  const g = c.getContext('2d', willRead ? { willReadFrequently: true } : undefined);
  g.imageSmoothingEnabled = false;
  return [c, g];
}
function rect(g, x, y, w, h, col) { g.fillStyle = col; g.fillRect(x, y, w, h); }
// Disco em pixel art (sem antialiasing): desenhado linha a linha
function disc(g, cx, cy, r, col) {
  g.fillStyle = col;
  for (let dy = -r; dy <= r; dy++) { const hw = Math.floor(Math.sqrt(r * r - dy * dy + 0.5)); g.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1); }
}
function ellipseFill(g, cx, cy, rx, ry, col) {
  g.fillStyle = col;
  for (let dy = -ry; dy <= ry; dy++) { const hw = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry)))); g.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1); }
}
// Contorno externo de 1px (usado no personagem, carros e objetos)
function addOuterOutline(g, w, h, col) {
  const img = g.getImageData(0, 0, w, h), d = img.data;
  const a = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) a[i] = d[i * 4 + 3] > 0 ? 1 : 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x; if (a[i]) continue;
    if ((x > 0 && a[i - 1]) || (x < w - 1 && a[i + 1]) || (y > 0 && a[i - w]) || (y < h - 1 && a[i + w])) {
      d[i * 4] = col[0]; d[i * 4 + 1] = col[1]; d[i * 4 + 2] = col[2]; d[i * 4 + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
}
// Rotaciona um canvas em múltiplos de 90° (mapeamento de pixels exato)
function rotateCanvas(src, quarter) {
  const w = src.width, h = src.height;
  const swap = quarter % 2 === 1;
  const [c, g] = makeCanvas(swap ? h : w, swap ? w : h);
  g.translate(c.width / 2, c.height / 2);
  g.rotate(quarter * Math.PI / 2);
  g.drawImage(src, -w / 2, -h / 2);
  return c;
}
// Silhueta preta de um sprite (para sombras projetadas)
function silhouette(src) {
  const [c, g] = makeCanvas(src.width, src.height);
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
  return c;
}
function distToSeg(px, py, x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - x0) * dx + (py - y0) * dy) / l2 : 0; t = clamp(t, 0, 1);
  return Math.hypot(px - (x0 + dx * t), py - (y0 + dy * t));
}
function distToPolyline(px, py, pts) {
  let m = Infinity;
  for (let i = 0; i < pts.length - 1; i++) m = Math.min(m, distToSeg(px, py, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]));
  return m;
}
function rectDist(px, py, r) {
  const dx = Math.max(r[0] - px, 0, px - (r[0] + r[2]));
  const dy = Math.max(r[1] - py, 0, py - (r[1] + r[3]));
  return Math.hypot(dx, dy);
}

// Fonte pixel 3x5 para letreiros desenhados no mundo
const FONT3 = {
  I: ['111', '010', '010', '010', '111'], F: ['111', '100', '110', '100', '100'], C: ['011', '100', '100', '100', '011'],
  A: ['010', '101', '111', '101', '101'], O: ['010', '101', '101', '101', '010'], P: ['110', '101', '110', '100', '100'],
  S: ['011', '100', '010', '001', '110'], E: ['111', '100', '110', '100', '111'], R: ['110', '101', '110', '101', '101'],
  V: ['101', '101', '101', '101', '010'], D: ['110', '101', '101', '101', '110'], '1': ['010', '110', '010', '010', '111'],
  '3': ['110', '001', '010', '001', '110'], '5': ['111', '100', '110', '001', '110'], '-': ['000', '000', '111', '000', '000'], ' ': ['000', '000', '000', '000', '000']
};
function drawPixelText(g, txt, x, y, col, s) {
  s = s || 1; g.fillStyle = col; let cx = x;
  for (const ch of txt) {
    const gl = FONT3[ch];
    if (gl) for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) if (gl[r][c] === '1') g.fillRect(cx + c * s, y + r * s, s, s);
    cx += 4 * s;
  }
}
// Logotipo do Instituto Federal (grade de quadrados verdes + círculo vermelho)
function drawIfcLogo(g, x, y, cell) {
  const L = ['rg.', 'ggg', 'gg.', 'ggg'];
  for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) {
    const ch = L[r][c], px = x + c * (cell + 1), py = y + r * (cell + 1);
    if (ch === 'g') rect(g, px, py, cell, cell, '#0f9d58');
    else if (ch === 'r') { if (cell <= 2) rect(g, px, py, cell, cell, '#e11d48'); else disc(g, px + (cell >> 1), py + (cell >> 1), cell >> 1, '#e11d48'); }
  }
}

/* =========================================================================
   2. GEOMETRIA DO MUNDO (baseada na foto aérea)
   ========================================================================= */
// Rodovia SC-135 na diagonal inferior
const ROAD_W = 78;
function roadTop(x) { return 1385 + x * 0.065; }

// Borda inferior da mata nativa ao norte
function forestNorthBottom(x) {
  let b;
  if (x < 300) b = 560 - (x / 300) * 245;
  else if (x < 1660) b = 315;
  else if (x < 1800) b = 315 - (x - 1660) / 140 * 95;
  else b = 220;
  return b + (noise1(x * 0.02) - 0.5) * 16 + (noise1(x * 0.09 + 7) - 0.5) * 6;
}
// Borda superior da mata a sudeste
function forestSETop(x) {
  if (x < 1580) return Infinity;
  const base = 1230 - (x - 1580) * 0.3 + Math.max(0, 1640 - x) * 2;
  return base + (noise1(x * 0.025 + 3) - 0.5) * 30 + (noise1(x * 0.1 + 9) - 0.5) * 10;
}
function forestSEBottom(x) { return roadTop(x) - 14; }

// Ruas internas (asfalto com meio-fio)
const ROADS = [
  { name: 'avenida', pts: [[1350, 370], [1350, 1438]], w: 80 },
  { name: 'norte', pts: [[310, 355], [1690, 355]], w: 50 },
  { name: 'nordeste', pts: [[1690, 355], [2040, 690], [2040, 800]], w: 46 }
];
const DIRT_ROADS = [{ pts: [[310, 372], [320, 600], [320, 760]], w: 26 }];

// Calçadas e pátios pavimentados [x, y, w, h]
const PAVED = [
  [290, 380, 1400, 14],      // calçada sul da rua norte
  [1294, 394, 16, 960],      // calçada oeste da avenida
  [1390, 394, 14, 416],      // calçada leste da avenida (norte)
  [1390, 1155, 14, 190],     // calçada leste da avenida (sul)
  [540, 394, 754, 470],      // pátio acadêmico
  [430, 680, 120, 184],      // calçada oeste do prédio principal
  [940, 864, 354, 130],      // frente do bloco administrativo
  [1404, 430, 106, 116],     // entorno da copa
  [1810, 290, 180, 150],     // entorno do refeitório
  [2070, 490, 312, 275]      // base do ginásio
];
const GYM_PLAZA = [2030, 765, 355, 90];
const SAND_COURT = [2110, 875, 160, 80];
const AUDI_LAWN = [772, 398, 176, 162];
const PARK_MAIN = [640, 1000, 650, 350];
const PARK_EAST = [1404, 810, 110, 345];

// Lagos (definidos por forma polar orgânica)
function polarR(keys, ang) {
  const a = ang * 180 / Math.PI;
  let k0, k1, a0, a1, found = false;
  for (let i = 0; i < keys.length; i++) {
    if (keys[i][0] >= a) {
      k1 = keys[i]; a1 = k1[0];
      if (i > 0) { k0 = keys[i - 1]; a0 = k0[0]; } else { k0 = keys[keys.length - 1]; a0 = k0[0] - 360; }
      found = true; break;
    }
  }
  if (!found) { k0 = keys[keys.length - 1]; a0 = k0[0]; k1 = keys[0]; a1 = k1[0] + 360; }
  let t = (a - a0) / (a1 - a0); t = t * t * (3 - 2 * t);
  const r = k0[1] + (k1[1] - k0[1]) * t;
  return r * (1 + 0.035 * Math.sin(ang * 5 + 1.3) + 0.02 * Math.sin(ang * 11 + 0.4));
}
const LAKE_DEFS = [
  {
    id: 'big', name: 'Lago Principal', cx: 1790, cy: 760, maxR: 330,
    keys: [[-135, 300], [-100, 268], [-42, 165], [13, 195], [44, 270], [77, 262], [122, 268], [160, 230]],
    colors: { edge: '#6aa97a', shallow: '#3f7f58', mid: '#30694b', deep: '#26573f', hl: '#94d3a3', dark: '#1d4633', spark: '#eafff1', foam: '#b9e3c2' },
    inside(x, y, grow) { grow = grow || 0; const dx = x - this.cx, dy = y - this.cy, d = Math.hypot(dx, dy); if (d > this.maxR + grow + 10) return false; return d < polarR(this.keys, Math.atan2(dy, dx)) + grow; },
    pierRow: 742
  },
  {
    id: 'small', name: 'Lago Menor', cx: 2160, cy: 355, rx: 125, ry: 85, maxR: 148,
    colors: { edge: '#6fb0a0', shallow: '#3f8a78', mid: '#2e7064', deep: '#235b52', hl: '#98dccb', dark: '#1b4740', spark: '#effffb', foam: '#c3ece0' },
    inside(x, y, grow) {
      grow = grow || 0; const dx = x - this.cx, dy = y - this.cy, a = Math.atan2(dy, dx);
      const k = 1 + 0.07 * Math.sin(3 * a + 1) + 0.04 * Math.sin(7 * a + 2);
      const ex = dx / ((this.rx + grow) * k), ey = dy / ((this.ry + grow) * k);
      return ex * ex + ey * ey < 1;
    }
  }
];

// Locais com interação (portas) — coordenadas fiéis à foto
const LOCATIONS = [
  { id: 'guarita', name: 'Guarita / Pórtico de Entrada', desc: 'Controle de acesso principal do campus, ligado à Rodovia SC-135.',
    rects: [[1339, 1352, 22, 28]], doors: [[1350, 1381]], label: [1350, 1320] },

// O estudante (16x24) — 4 direções x 4 quadros
function drawStudent(g, dir, f) {
  const Px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  const SK = '#f2c28c', SKD = '#d79a62', HA = '#3a2618', HAL = '#6b4529', SH = '#10b981', SHD = '#0a8a5f', SHL = '#6ee7b7',
    PA = '#2c4472', PAD = '#1d2f55', SO = '#1d1d24', SOH = '#3a3a46', BG = '#8b5cf6', BGD = '#6d3fe0', BGL = '#b69cff', EYE = '#1a1a22', WH = '#f8fafc';
  const step = f === 1 ? 1 : (f === 3 ? -1 : 0);
  if (dir === 'down' || dir === 'up') {
    const hL = step === 1 ? 4 : (step === -1 ? 2 : 3), hR = step === -1 ? 4 : (step === 1 ? 2 : 3);
    Px(4, 17, 8, 1, PA);
    Px(4, 18, 3, hL, PA); Px(6, 18, 1, hL, PAD); Px(4, 18 + hL, 3, 2, SO); Px(4, 18 + hL, 1, 1, SOH);
    Px(9, 18, 3, hR, PA); Px(9, 18, 1, hR, PAD); Px(9, 18 + hR, 3, 2, SO); Px(9, 18 + hR, 1, 1, SOH);
    Px(4, 11, 8, 6, SH); Px(4, 15, 8, 2, SHD);
    const aL = step === 1 ? 2 : (step === -1 ? 4 : 3), aR = step === -1 ? 2 : (step === 1 ? 4 : 3);
    Px(2, 11, 2, 2, SH); Px(2, 13, 2, aL, SK); Px(2, 12 + aL, 2, 1, SKD);
    Px(12, 11, 2, 2, SH); Px(12, 13, 2, aR, SK); Px(12, 12 + aR, 2, 1, SKD);
    if (dir === 'down') {
      Px(6, 11, 4, 1, WH); Px(7, 12, 2, 1, SHL);
      Px(5, 11, 1, 5, BG); Px(10, 11, 1, 5, BG);
      Px(4, 2, 8, 8, SK); Px(4, 9, 8, 1, SKD);
      Px(4, 1, 8, 4, HA); Px(3, 2, 1, 6, HA); Px(12, 2, 1, 6, HA); Px(5, 5, 2, 1, HA); Px(9, 5, 2, 1, HA); Px(6, 1, 3, 1, HAL);
      Px(6, 7, 1, 2, EYE); Px(9, 7, 1, 2, EYE); Px(7, 9, 2, 1, '#c0704a');
      Px(7, 10, 2, 1, SKD);
    } else {
      Px(5, 11, 6, 6, BG); Px(5, 11, 6, 1, BGL); Px(5, 16, 6, 1, BGD); Px(6, 13, 4, 2, BGD);
      Px(4, 1, 8, 9, HA); Px(6, 1, 3, 1, HAL); Px(5, 3, 1, 2, HAL);
      Px(3, 5, 1, 2, SK); Px(12, 5, 1, 2, SK); Px(6, 10, 4, 1, SKD);
    }
  } else { // 'right' (a esquerda é o espelho)
    if (step === 0) { Px(6, 17, 4, 1, PA); Px(6, 18, 4, 3, PA); Px(6, 18, 1, 3, PAD); Px(6, 21, 5, 2, SO); Px(6, 21, 1, 1, SOH); }
    else {
      const a = step === 1 ? PA : PAD, b = step === 1 ? PAD : PA;
      Px(6, 17, 4, 1, PA);
      Px(4, 18, 3, 3, b); Px(3, 21, 3, 2, SO);
      Px(8, 18, 3, 3, a); Px(9, 21, 3, 2, SO); Px(9, 21, 1, 1, SOH);
    }
    Px(5, 11, 6, 6, SH); Px(5, 15, 6, 2, SHD);
    Px(3, 11, 3, 6, BG); Px(3, 11, 3, 1, BGL); Px(3, 16, 3, 1, BGD);
    if (step === 0) { Px(7, 11, 2, 3, SHD); Px(7, 14, 2, 2, SK); }
    else if (step === 1) { Px(8, 11, 2, 2, SHD); Px(9, 13, 2, 2, SK); }
    else { Px(6, 11, 2, 2, SHD); Px(5, 13, 2, 2, SK); }
    Px(5, 2, 7, 8, SK); Px(5, 9, 7, 1, SKD);
    Px(5, 1, 7, 4, HA); Px(5, 5, 3, 3, HA); Px(11, 4, 1, 1, HA); Px(7, 1, 3, 1, HAL);
    Px(10, 6, 1, 2, EYE); Px(12, 7, 1, 1, SK); Px(8, 6, 1, 2, SKD); Px(6, 10, 3, 1, SKD);
  }
}

/* =========================================================================
   6. LAGOS ANIMADOS, PÍER E COLISÃO DA ÁGUA
   ========================================================================= */
function buildLakes() {
  for (const def of LAKE_DEFS) {
    const pad = def.maxR + 14;
    const x0 = Math.max(0, Math.floor(def.cx - pad)), y0 = Math.max(0, Math.floor(def.cy - pad));
    const x1 = Math.min(W, Math.ceil(def.cx + pad)), y1 = Math.min(H, Math.ceil(def.cy + pad));
    const lw = x1 - x0, lh = y1 - y0;

    // Pré-calcula máscara e distância à margem para ondas e espuma
    const mask = new Uint8Array(lw * lh);
    const bankMask = new Uint8Array(lw * lh);
    for (let y = 0; y < lh; y++) {
      for (let x = 0; x < lw; x++) {
        const wx = x0 + x, wy = y0 + y;
        if (def.inside(wx, wy, 4)) bankMask[y * lw + x] = 1;
        if (def.inside(wx, wy, 0)) mask[y * lw + x] = 1;
      }
    }
    const dist = new Uint8Array(lw * lh);
    for (let y = 0; y < lh; y++) {
      for (let x = 0; x < lw; x++) {
        const i = y * lw + x;
        if (!mask[i]) continue;
        let d = 22;
        for (let r = 1; r <= 21; r += 2) {
          if (x - r < 0 || x + r >= lw || y - r < 0 || y + r >= lh ||
              !mask[i - r] || !mask[i + r] || !mask[i - r * lw] || !mask[i + r * lw]) { d = r; break; }
        }
        dist[i] = d;
      }
    }

    // Desenha margem úmida/grama escura no cenário estático
    const cEdge = C(def.colors.edge), cShallow = C(def.colors.shallow), cMid = C(def.colors.mid),
          cDeep = C(def.colors.deep), cHl = C(def.colors.hl), cDark = C(def.colors.dark),
          cSpark = C(def.colors.spark), cFoam = C(def.colors.foam);
    const [bc, bg2] = makeCanvas(lw, lh);
    const bImg = bg2.createImageData(lw, lh), bd = bImg.data;
    for (let y = 0; y < lh; y++) {
      for (let x = 0; x < lw; x++) {
        const i = y * lw + x;
        if (!bankMask[i]) continue;
        const p = i * 4;
        const col = hash2(x, y) < 0.45 ? [58, 92, 48] : [76, 108, 56];
        bd[p] = col[0]; bd[p + 1] = col[1]; bd[p + 2] = col[2]; bd[p + 3] = 255;
      }
    }
    bg2.putImageData(bImg, 0, 0);
    bgx.drawImage(bc, x0, y0);

    // 4 quadros de animação em pixel art para a água
    const frames = [];
    for (let f = 0; f < 4; f++) {
      const [fc, fg] = makeCanvas(lw, lh);
      const img = fg.createImageData(lw, lh), d = img.data;
      const phase = f * 3;
      for (let y = 0; y < lh; y++) {
        for (let x = 0; x < lw; x++) {
          const i = y * lw + x;
          if (!mask[i]) continue;
          const ed = dist[i];
          const wx = x0 + x, wy = y0 + y;
          let col;
          if (ed <= 1) col = ((wx + wy + f) % 5 === 0) ? cFoam : cEdge;
          else if (ed <= 5) col = (bayer(wx, wy) < 0.35) ? cEdge : cShallow;
          else if (ed <= 13) col = (bayer(wx, wy) < 0.4) ? cShallow : cMid;
          else if (ed <= 19) col = (bayer(wx, wy) < 0.45) ? cMid : cDeep;
          else col = (hash2(wx >> 2, wy >> 2) < 0.22) ? cDark : cDeep;

          // Cristas de onda horizontais animadas (2-4px de largura)
          if (ed > 4 && (wy % 9) === ((Math.floor(wx / 18) * 3 + f * 2) % 9)) {
            const seg = (wx + phase + (wy * 5)) % 23;
            if (seg < 4) col = ed > 12 ? cHl : cFoam;
          }
          // Brilhos solares pontuais
          if (ed > 9 && ((wx * 13 + wy * 7) % 197 === 0)) {
            if (((wx + wy + f) & 3) === 0) col = cSpark;
          }
          const p = i * 4;
          d[p] = col[0]; d[p + 1] = col[1]; d[p + 2] = col[2]; d[p + 3] = 255;
        }
      }
      fg.putImageData(img, 0, 0);
      frames.push(fc);
    }

    // Colisão sólida em faixas horizontais (acompanha fielmente a margem curva)
    const pierY0 = def.pierRow ? def.pierRow - 7 : -999;
    const pierY1 = def.pierRow ? def.pierRow + 7 : -999;
    for (let wy = y0; wy < y1; wy += 8) {
      let inRun = false, rx0 = 0;
      for (let wx = x0; wx <= x1; wx += 4) {
        let solid = wx < x1 && (def.inside(wx, wy + 2, -2) || def.inside(wx, wy + 6, -2));
        // Permite caminhar sobre o píer de madeira na margem oeste do lago grande
        if (def.pierRow && wy + 4 >= pierY0 && wy + 4 <= pierY1 && wx >= 1516 && wx <= 1564) solid = false;
        if (solid && !inRun) { inRun = true; rx0 = wx; }
        else if (!solid && inRun) {
          inRun = false;
          if (wx - rx0 >= 4) addSolid(rx0, wy, wx - rx0, 8, 'lago');
        }
      }
    }
    LAKES.push({ def, x: x0, y: y0, w: lw, h: lh, frames });
  }

  // Guarda-corpo invisível nas laterais e ponta do píer para não cair na água
  addSolid(1518, 731, 48, 3, 'pier');
  addSolid(1518, 750, 48, 3, 'pier');
  addSolid(1564, 731, 4, 22, 'pier');

  // Píer de madeira na margem oeste do Lago Principal
  const [pc, pg] = makeCanvas(54, 24);
  rect(pg, 2, 18, 4, 5, '#3b2616'); rect(pg, 22, 18, 4, 5, '#3b2616'); rect(pg, 44, 18, 4, 5, '#3b2616');
  rect(pg, 0, 4, 50, 15, '#7c502b');
  for (let x = 1; x < 49; x += 4) {
    rect(pg, x, 5, 3, 13, (x % 8 === 1) ? '#9c6839' : '#8d5b31');
    rect(pg, x, 6, 1, 1, '#4a2f1a'); rect(pg, x, 16, 1, 1, '#4a2f1a');
  }
  rect(pg, 0, 3, 50, 2, '#5c3a1e'); rect(pg, 0, 18, 50, 2, '#4a2e17');
  DECOR.push({ c: pc, x: 1516, y: 730 });

  // Aerador / balsa flutuante visível na foto aérea do Lago Principal
  const [ac, ag] = makeCanvas(34, 16);
  rect(ag, 2, 6, 30, 7, '#334155'); rect(ag, 3, 4, 28, 6, '#64748b');
  for (let kx = 5; kx < 28; kx += 8) { rect(ag, kx, 2, 5, 5, '#94a3b8'); rect(ag, kx + 1, 3, 3, 2, '#cbd5e1'); }
  rect(ag, 1, 12, 32, 2, '#b9e3c2');
  DECOR.push({ c: ac, x: 1868, y: 882 });

  // Vitórias-régias e pedras aquáticas
  const R = mulberry32(707);
  for (let i = 0; i < 28; i++) {
    const ang = R() * Math.PI * 2;
    const rad = polarR(LAKE_DEFS[0].keys, ang) - 10 - R() * 22;
    const lx = Math.round(LAKE_DEFS[0].cx + Math.cos(ang) * rad);
    const ly = Math.round(LAKE_DEFS[0].cy + Math.sin(ang) * rad);
    if (Math.abs(ly - 742) < 18 && lx < 1580) continue;
    const [lc, lg] = makeCanvas(9, 7);
    ellipseFill(lg, 4, 3, 3, 2, '#3d8b48');
    rect(lg, 4, 3, 3, 1, '#26573f');
    if (R() < 0.35) rect(lg, 3, 2, 2, 2, '#f9a8d4');
    DECOR.push({ c: lc, x: lx, y: ly });
  }
  const [rk, rg] = makeCanvas(14, 10);
  ellipseFill(rg, 7, 6, 6, 3, '#575e66'); ellipseFill(rg, 6, 5, 4, 2, '#868f98'); rect(rg, 4, 4, 3, 1, '#b0b8c0');
  for (const [rx, ry] of [[1542, 690], [1565, 820], [1985, 720], [1960, 940], [2050, 345]]) DECOR.push({ c: rk, x: rx, y: ry });
}

function drawCurbBox(g, x, y, w, h, fillPat, curbLight, curbDark) {
  rect(g, x - 2, y - 2, w + 4, h + 4, curbDark || '#7d8288');
  rect(g, x - 1, y - 1, w + 2, h + 2, curbLight || '#d5d9dd');
  rect(g, x, y, w, h, fillPat);
}
function drawCrosswalk(g, x, y, w, h, horizontalStripes) {
  g.fillStyle = '#e6eaee';
  if (horizontalStripes) {
    for (let sy = y + 2; sy < y + h - 2; sy += 6) g.fillRect(x, sy, w, 3);
  } else {
    for (let sx = x + 2; sx < x + w - 2; sx += 6) g.fillRect(sx, y, 3, h);
  }
}

function drawTerrain() {
  // 1) Gramado base em todo o mundo
  rect(bgx, 0, 0, W, H, PAT.grass);

  // Variações suaves de gramado (manchas orgânicas claras/escuras e canteiros)
  const R = mulberry32(2026);
  for (let i = 0; i < 160; i++) {
    const gx = Math.floor(R() * W), gy = Math.floor(260 + R() * 1160);
    ellipseFill(bgx, gx, gy, 18 + Math.floor(R() * 34), 10 + Math.floor(R() * 18),
      R() < 0.5 ? 'rgba(124,189,78,0.16)' : 'rgba(42,92,34,0.14)');
  }

  // 2) Solo escuro sob a Floresta Norte e Sudeste + barranco avermelhado ao norte
  for (let x = 0; x < W; x += 2) {
    const fn = Math.round(forestNorthBottom(x));
    bgx.fillStyle = PAT.forestFloor;
    bgx.fillRect(x, 0, 2, fn + 4);
    if (x >= 290 && x <= 1710) {
      bgx.fillStyle = PAT.dirt;
      bgx.fillRect(x, fn + 2, 2, Math.max(0, 332 - fn));
      rect(bgx, x, fn + 2, 2, 2, '#6d4728');
    }
    const fse = forestSETop(x);
    if (fse < H) {
      const fseB = Math.round(forestSEBottom(x));
      if (fseB > fse) {
        bgx.fillStyle = PAT.forestFloor;
        bgx.fillRect(x, Math.round(fse), 2, fseB - Math.round(fse));
      }
    }
  }

  // 3) Estrada de terra lateral oeste + pátio de brita do Barracão e canteiros das Estufas
  for (const dr of DIRT_ROADS) {
    strokePolyline(bgx, dr.pts, dr.w + 4, '#7a5232');
    strokePolyline(bgx, dr.pts, dr.w, PAT.dirt);
  }
  // Caminho até o barracão inclinado
  strokePolyline(bgx, [[320, 680], [210, 690], [130, 745]], 34, PAT.gravel);
  ellipseFill(bgx, 165, 700, 125, 65, PAT.gravel);

  // Canteiros agrícolas ao lado das estufas
  drawCurbBox(bgx, 352, 462, 184, 42, PAT.soil, '#8c6b4f', '#523a26');
  for (let ry = 468; ry < 500; ry += 7) {
    rect(bgx, 358, ry, 172, 3, '#3c2718');
    for (let rx = 362; rx < 526; rx += 6) {
      rect(bgx, rx, ry - 1, 3, 3, '#3b873e');
      rect(bgx, rx + 1, ry - 2, 1, 1, '#7ad168');

// Desenha prédio no mundo + sombra projetada + faixa superior para oclusão 3/4 + hitboxes AABB
function placeStructure(canvas, bx, baseBottomY, solidRects, roofLift, tag) {
  const drawY = baseBottomY - canvas.height;
  // Sombra projetada a sudeste
  const sh = silhouette(canvas);
  bgx.save();
  bgx.globalAlpha = 0.24;
  bgx.drawImage(sh, bx + 7, drawY + 6);
  bgx.restore();
  // Corpo completo no cenário base (permite caminhar na frente de portas e em pátios internos sem glitch)
  bgx.drawImage(canvas, bx, drawY);

  // Faixas superiores de telhado em SPRITES para cobrir os pés do jogador quando ele passa por trás do prédio
  for (const r of solidRects) {
    addSolid(r[0], r[1], r[2], r[3], tag);
    const capTop = Math.max(drawY, r[1] - roofLift);
    const capH = (r[1] + 5) - capTop;
    if (capH > 0) {
      const sx = r[0] - bx, sy = capTop - drawY;
      const cw = Math.min(r[2], canvas.width - sx);
      if (sx >= 0 && sy >= 0 && cw > 0) {
        const [cap, cg] = makeCanvas(cw, capH);
        cg.drawImage(canvas, sx, sy, cw, capH, 0, 0, cw, capH);
        SPRITES.push({ c: cap, x: r[0], y: capTop, sortY: r[1] + 6 });
      }
    }
  }
}

      for (let x = 0; x < w; x++) {
        let base = mix(C('#6ea894'), C('#b8e4d0'), arch * 0.75);
        // Sombra das bancadas verdes internas vistas através do policarbonato
        if (y > 6 && y < 36 && (y % 7 < 4) && x > 6 && x < w - 6) base = mix(base, C('#2e7d47'), 0.32);
        // Arcos metálicos a cada 14px
        if (x % 14 === 0 || x === w - 1) base = C('#dce7eb');
        // Brilho especular no topo da estufa
        if (y >= 11 && y <= 15 && (x % 14 !== 0)) base = mix(base, C('#f0fdf9'), 0.55);
        rect(g, x, y, 1, 1, rgbStr(base));
      }
    }
    // Parede frontal translúcida + base de alvenaria
    for (let y = 42; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let col = y >= h - 3 ? '#64748b' : (x % 14 === 0 ? '#cbd5e1' : ((x + y) % 5 === 0 ? '#99d5c4' : '#5f9688'));
        if (x >= 79 && x < 91 && y >= 43) col = (x === 79 || x === 90 || y === 43) ? '#e2e8f0' : '#334e48';
        rect(g, x, y, 1, 1, col);
      }
    }
    addOuterOutline(g, w, h, [26, 48, 44]);
    return c;
  }
  const gh = makeGreenhouse();
  placeStructure(gh, 360, 562, [LOCATIONS[4].rects[0]], 8, 'estufa');
  placeStructure(gh, 360, 628, [LOCATIONS[4].rects[1]], 8, 'estufa');

  // -----------------------------------------------------------------------
  // 7) BARRACÃO / GARAGEM INCLINADO (Extremo Oeste perto da grama)
  // -----------------------------------------------------------------------
  const [barC, barG] = makeCanvas(236, 150, true);
  // Desenha galpão inclinado (~26°) com telhado de zinco nervurado e baias de garagem
  const ax = 200, ay = 16, bx2 = 18, by2 = 112; // eixo da cumeeira
  const lenB = Math.hypot(bx2 - ax, by2 - ay);
  const ux = (bx2 - ax) / lenB, uy = (by2 - ay) / lenB;
  const nx = -uy, ny = ux; // normal
  for (let y = 0; y < 134; y++) {
    for (let x = 0; x < 236; x++) {
      const dx = x - ax, dy = y - ay;
      const along = dx * ux + dy * uy;
      const perp = dx * nx + dy * ny;
      if (along >= 0 && along <= lenB && Math.abs(perp) <= 19) {
        let col = perp < 0 ? C('#d6dde3') : C('#adb7c1');
        if (Math.abs(perp) < 1.3) col = C('#f8fafc');
        else if (Math.floor(along) % 7 === 0) col = shade(col, 0.88);
        if (Math.abs(perp) > 17.5) col = C('#64707d');
        rect(barG, x, y, 1, 1, rgbStr(col));
      }
    }
  }
  // Parede frontal escura sob a borda sul do telhado inclinado (baias de máquinas)
  const barData = barG.getImageData(0, 0, 236, 134).data;
  for (let x = 12; x < 224; x++) {
    let yb = -1;
    for (let y = 133; y >= 0; y--) {
      if (barData[(y * 236 + x) * 4 + 3] > 0) { yb = y; break; }
    }
    if (yb > 0) {
      for (let k = 1; k <= 13; k++) {
        const wy = yb + k; if (wy >= 150) break;
        const isBay = (x % 28 >= 6 && x % 28 <= 21) && k >= 3;
        rect(barG, x, wy, 1, 1, k >= 12 ? '#0a6640' : (isBay ? '#1f2937' : '#dce2e6'));
      }
    }
  }
  addOuterOutline(barG, 236, 150, [24, 30, 36]);
  placeStructure(barC, 48, 742, LOCATIONS[5].rects, 6, 'barracao');

  // -----------------------------------------------------------------------
  // 8) AUDITÓRIO (Centro-Norte, telhado icônico em leque / poligonal)
  // -----------------------------------------------------------------------
  const audi = renderBuilding({
    w: 148, h: 142, wallH: 18, wallMode: 'toBase',
    shape: (x, y) => {
      // Polígono em leque (octogonal/trapezoidal aberto ao norte e afunilado ao sul)
      const cx = 74;
      const dx = Math.abs(x - cx);
      if (y < 4 || y >= 122) return false;
      if (y < 24) return dx <= 36 + (y - 4) * 1.7;        // chanfros superiores do leque
      if (y < 76) return dx <= 70 - (y - 24) * 0.28;      // laterais largas
      return dx <= 55 - (y - 76) * 0.62;                  // funil até o foyer frontal
    },
    roof: (x, y, ed) => {
      if (ed <= 1) return C('#ffffff');
      if (ed === 2) return C('#b8c1ca');
      // Nervuras radiais do telhado em leque convergindo para (74, 118)
      const ang = Math.atan2(118 - y, x - 74);
      const deg = ang * 180 / Math.PI;
      const sector = Math.round(deg / 18) * 18;
      if (Math.abs(deg - sector) < 1.15) return C('#9aa4b0');
      const shadeFactor = 0.94 + 0.09 * Math.cos((deg - 110) * Math.PI / 180);
      return shade(C('#e9eef2'), shadeFactor);
    },
    wall: (x, k, len) => {
      const kb = len - 1 - k;
      const dx = Math.abs(x - 74);
      // Fachada curva envidraçada verde-escura na entrada sul do auditório
      if (dx <= 26) {
        if (kb < 2) return P.greenD;
        if (k === 0) return P.eave;
        if (dx <= 8 && kb < 10) return ((x + kb) % 4 === 0) ? P.glassL : P.glassD;
        return (x % 5 === 0) ? P.greenD : P.green;
      }
      return kb < 3 ? P.green : (k === 0 ? P.eave : P.wall);
    },
    decorate: (g) => { acUnit(g, 66, 92); }
  });
  placeStructure(audi, 786, 540, LOCATIONS[6].rects, 16, 'auditorio');

  // -----------------------------------------------------------------------
  // 9) BIBLIOTECA E BLOCO PEDAGÓGICO (Centro-Norte, fachada branca + curva verde)
  // -----------------------------------------------------------------------
  const biblio = renderBuilding({
    w: 164, h: 190, wallH: 26, wallMode: 'toBase',
    shape: (x, y) => {
      const main = x >= 0 && x < 132 && y >= 0 && y < 156;
      const east = x >= 132 && x < 160 && y >= 10 && y < 148;
      // Rotunda curva frontal característica vista na foto aérea
      const rotunda = y >= 148 && y < 164 && Math.hypot((x - 68) * 0.85, (y - 148) * 1.7) <= 34;
      return main || east || rotunda;
    },
    roof: (x, y, ed) => {
      const base = C('#e3e8ed');
      if (ed <= 1) return C('#ffffff');
      if (ed === 2) return C('#b4bec8');
      if (Math.abs(x - 66) <= 1 && y < 150) return C('#ffffff');
      if (y % 14 === 0) return shade(base, 0.92);
      return x < 66 ? shade(base, 1.03) : shade(base, 0.96);
    },
    wall: (x, k, len, info) => {
      const kb = len - 1 - k;
      // Curva frontal em vidro verde institucional (marca registrada desse bloco na foto!)
      if (x >= 32 && x <= 104) {
        if (kb < 3) return P.greenD;
        if (k === 0) return P.eave;
        if (x >= 59 && x < 75 && kb < 12) return ((x + kb) % 5 === 0) ? P.glassL : P.glassD;
        if (kb >= 5 && kb <= 21) {
          if (x % 6 === 0) return C('#d1fae5');
          return ((x + kb) % 7 === 0) ? C('#34d399') : C('#0b6b45');
        }
        return P.green;
      }
      return makeWall({
        trimH: 4,
        windows: { offset: 4, period: 12, width: 7, rows: [[6, 11], [15, 20]] }
      })(x, k, len, info);
    },
    decorate: (g) => { skylight(g, 48, 45, 36, 12); skylight(g, 48, 92, 36, 12); }
  });
  placeStructure(biblio, 1120, 580, LOCATIONS[7].rects, 18, 'biblioteca');

  // -----------------------------------------------------------------------
  // 10) COPA / CANTINA (Centro, telhado colonial cor de telha entre a avenida e o lago)
  // -----------------------------------------------------------------------
  const copa = renderBuilding({
    w: 94, h: 106, wallH: 15,
    shape: (x, y) => x >= 0 && x < 94 && y >= 0 && y < 91,
    roof: hipRoof(94, 91, {
      eave: C('#7c3416'), ridge: C('#f6ad7b'),
      T: C('#d96b34'), L: C('#e0763e'), B: C('#c25725'), R: C('#ae4b1e')
    }),
    wall: makeWall({
      base: C('#f7f3eb'), trim: C('#854d27'), trimD: C('#5c3419'), trimH: 3,
      shutter: C('#0f8a57'),
      windows: { offset: 10, period: 26, width: 11, rows: [[5, 11]] },
      skip: [[36, 58]],
      doors: [{ x: 40, w: 14, h: 11, doorFrame: C('#6b3f21') }]
    })
  });
  placeStructure(copa, 1408, 532, LOCATIONS[8].rects, 14, 'copa');

  // -----------------------------------------------------------------------
  // 11) REFEITÓRIO (Nordeste, prédio branco de telhado claro entre os lagos)
  // -----------------------------------------------------------------------
  const refeit = renderBuilding({
    w: 160, h: 148, wallH: 18,
    shape: (x, y) => x >= 0 && x < 160 && y >= 0 && y < 130,
    roof: (x, y, ed) => {
      const base = C('#e6ecf2');
      if (ed <= 1) return C('#ffffff');
      if (ed === 2) return C('#b9c4d0');
      if (Math.abs(y - 65) <= 1) return C('#ffffff');
      if (x % 12 === 0) return shade(base, 0.92);
      return y < 65 ? shade(base, 1.03) : shade(base, 0.95);
    },
    wall: makeWall({
      trimH: 3, stripe: 14,
      windows: { offset: 8, period: 16, width: 10, rows: [[6, 12]] },
      skip: [[68, 92]],
      doors: [{ x: 72, w: 16, h: 12 }]
    }),
    decorate: (g) => { vent(g, 36, 40); vent(g, 80, 40); vent(g, 124, 40); acUnit(g, 136, 95); }
  });
  placeStructure(refeit, 1820, 430, LOCATIONS[9].rects, 16, 'refeitorio');

  // -----------------------------------------------------------------------
  // 12) GINÁSIO POLIESPORTIVO (Extremo Leste, teto arqueado metálico + anexo de vestiários)
  // -----------------------------------------------------------------------
  // Anexo lateral esquerdo (vestiários): [2080, 560, 80, 200]
  const vestiarios = renderBuilding({
    w: 82, h: 214, wallH: 16,
    shape: (x, y) => x >= 0 && x < 82 && y >= 0 && y < 198,
    roof: flatRoof(C('#dfe5ec'), C('#aeb8c2'), C('#f8fafc'), C('#c4cdd6')),
    wall: makeWall({
      trimH: 3,
      windows: { offset: 6, period: 14, width: 8, rows: [[8, 12]] },
      skip: [[30, 50]],
      doors: [{ x: 34, w: 12, h: 11 }]
    })
  });
  placeStructure(vestiarios, 2080, 760, [LOCATIONS[10].rects[1]], 14, 'ginasio-anexo');

  // Nave principal do Ginásio com teto em abóbada metálica brilhante: [2160, 500, 210, 260]
  const [gymC, gymG] = makeCanvas(214, 286);
  const archW = 210, roofTopH = 248;
  // Teto arqueado metálico com reflexo especular (como na foto aérea!)
  for (let y = 0; y < roofTopH; y++) {
    for (let x = 2; x < 2 + archW; x++) {
      const u = (x - 2) / (archW - 1); // 0..1 da esquerda p/ direita
      // Curvatura da fachada em arco na base do teto
      const archLift = Math.round(Math.sin(u * Math.PI) * 14);
      if (y < 14 - archLift) continue;
      if (y > roofTopH - 1 - (14 - archLift)) continue;
      const spec = Math.exp(-Math.pow((u - 0.34) / 0.18, 2));
      let col = mix(C('#b9c3cf'), C('#f6f9fc'), spec * 0.85);
      if (u > 0.72) col = mix(col, C('#8c97a6'), (u - 0.72) / 0.28);
      if (y % 14 === 0) col = shade(col, 0.86);
      if (x === 2 || x === 1 + archW) col = C('#e2e8f0');
      rect(gymG, x, y, 1, 1, rgbStr(col));
    }
  }
  // Parede frontal alta do ginásio acompanhando o arco metálico
  for (let x = 2; x < 2 + archW; x++) {
    const u = (x - 2) / (archW - 1);
    const archLift = Math.round(Math.sin(u * Math.PI) * 14);
    const topWall = roofTopH - (14 - archLift);
    for (let y = topWall; y < 286; y++) {
      const kb = 285 - y;
      let col = '#eef1f4';
      if (y === topWall || y === topWall + 1) col = '#0f8a57';
      else if (kb < 4) col = kb === 0 ? '#0a6640' : '#0f8a57';
      // Venezianas de ventilação superiores
      else if (kb >= 22 && kb <= 27 && x > 18 && x < 194 && (x % 12 < 8)) col = (kb % 2 === 0) ? '#64748b' : '#94a3b8';
      // Portões duplos do ginásio
      else if (Math.abs(x - 107) <= 18 && kb < 15) {
        if (Math.abs(x - 107) === 18 || kb === 14 || x === 107) col = '#0f8a57';
        else col = ((x + kb) % 5 === 0) ? '#79a6cc' : '#23384e';
      } else if (kb === 15 && Math.abs(x - 107) <= 20) col = '#0a6640';
      // Pilares estruturais na fachada
      else if ((x - 2) % 30 < 3) col = '#d5dce2';
      rect(gymG, x, y, 1, 1, col);
    }
  }
  drawIfcLogo(gymG, 44, 266, 2);
  addOuterOutline(gymG, 214, 286, [24, 30, 38]);
  placeStructure(gymC, 2158, 760, [LOCATIONS[10].rects[0]], 20, 'ginasio');
}

/* =========================================================================
   9. FLORESTA DENSA, ÁRVORES DO CAMPUS, CARROS ESTACIONADOS E MOBILIÁRIO
   ========================================================================= */
function insideAnyRect(x, y, list, pad) {
  pad = pad || 0;
  for (const r of list) if (x >= r[0] - pad && x <= r[0] + r[2] + pad && y >= r[1] - pad && y <= r[1] + r[3] + pad) return true;
  return false;
}
function nearAnySolid(x, y, pad) {
  for (const s of SOLIDS) if (x >= s.x - pad && x <= s.x + s.w + pad && y >= s.y - pad && y <= s.y + s.h + pad) return true;
  return false;
}

function populateWorld() {
  const TV = buildTreeVariants();
  const R = mulberry32(4242);

  // 1) Barreira de colisão da Floresta Norte e Sudeste + Limites Sul/Rodovia
  for (let x = 0; x < W; x += 32) {
    const fn = Math.round(forestNorthBottom(x + 16));
    addSolid(x, 0, 32, Math.max(8, fn - 4), 'floresta-norte');
  }
  for (let x = 1584; x < W; x += 32) {
    const fse = Math.round(forestSETop(x + 16)) + 6;
    if (fse < H) addSolid(x, fse, 32, H - fse, 'floresta-sul');
  }
  // Muro/cerca sul e limite da Rodovia SC-135 (deixando o trevo de entrada aberto até y=1452)
  for (let x = 0; x < 1600; x += 32) {
    if (x >= 1304 && x < 1396) {
      addSolid(x, 1454, 32, H - 1454, 'limite-rodovia');
    } else {
      const limY = (x >= 496 && x < 1304)
        ? Math.min(1362, Math.round(roadTop(x + 16)) - 16)
        : Math.round(roadTop(x + 16)) - 12;
      addSolid(x, limY, 32, H - limY, 'cerca-sul');
    }
  }
  // Bordas extremas do mapa
  addSolid(0, 0, 6, H, 'borda');
  addSolid(W - 6, 0, 6, H, 'borda');
  addSolid(0, 0, W, 6, 'borda');
  addSolid(0, H - 6, W, 6, 'borda');

  // 2) Cinturão denso de árvores na Floresta Norte e Sudeste
  // Árvores profundas vão direto para o canvas estático (ordenadas por Y = zero custo por frame);
  // Árvores da borda vão para SPRITES para oclusão 3/4 perfeita com o personagem.
  const deepTrees = [];
  for (let y = 14; y < 580; y += 17) {
    for (let x = 12; x < W - 12; x += 19) {
      const jx = x + Math.round((R() - 0.5) * 12);
      const jy = y + Math.round((R() - 0.5) * 10);
      const lim = forestNorthBottom(jx);
      if (jy > lim + 3) continue;
      const spr = (R() < 0.09) ? TV.pine[Math.floor(R() * TV.pine.length)]
                : TV.forest[Math.floor(R() * TV.forest.length)];
      if (jy < lim - 20) deepTrees.push({ spr, x: jx, y: jy });
      else SPRITES.push({ c: spr.c, x: jx - spr.ox, y: jy - spr.oy, sortY: jy });
    }
  }
  for (let y = 960; y < H - 20; y += 18) {
    for (let x = 1580; x < W - 12; x += 19) {
      const jx = x + Math.round((R() - 0.5) * 12);
      const jy = y + Math.round((R() - 0.5) * 10);
      const top = forestSETop(jx), bot = forestSEBottom(jx);
      if (jy < top - 2 || jy > bot) continue;
      const spr = (R() < 0.12) ? TV.pine[Math.floor(R() * TV.pine.length)]
                : TV.forest[Math.floor(R() * TV.forest.length)];
      if (jy > top + 24) deepTrees.push({ spr, x: jx, y: jy });
      else SPRITES.push({ c: spr.c, x: jx - spr.ox, y: jy - spr.oy, sortY: jy });
    }
  }
  deepTrees.sort((a, b) => a.y - b.y);
  for (const t of deepTrees) bgx.drawImage(t.spr.c, t.x - t.spr.ox, t.y - t.spr.oy);

  // 3) Árvores paisagísticas do Campus (avenida, jardins, margens dos lagos e gramados)
  function placeCampusTree(tx, ty, spr, withSolid) {
    bgx.save(); bgx.globalAlpha = 0.22;
    ellipseFill(bgx, tx + 3, ty, Math.round(spr.w * 0.36), Math.round(spr.w * 0.18), '#000');
    bgx.restore();
    SPRITES.push({ c: spr.c, x: tx - spr.ox, y: ty - spr.oy, sortY: ty });
    TREE_POS.push([tx, ty]);
    if (withSolid) addSolid(tx - 4, ty - 4, 8, 5, 'arvore');
  }

  // Fileira ornamental no canteiro central da Avenida Interna
  for (let ay = 458; ay <= 985; ay += 48) {
    placeCampusTree(1350, ay, (ay % 96 === 458 % 96) ? TV.park[2] : TV.bush[0], ay % 96 === 458 % 96);
  }
  for (let ay = 1106; ay <= 1236; ay += 44) placeCampusTree(1350, ay, TV.park[0], true);

  // Jardins em frente ao Bloco Administrativo (preservando a porta em x=1100)
  for (const ax of [988, 1046, 1152, 1212]) placeCampusTree(ax, 978, TV.park[1], true);
  // Ilhas do Estacionamento Principal
  for (const ix of [818, 878, 938, 1034, 1094, 1154]) placeCampusTree(ix, 1168, TV.park[0], true);
  // Canteiros do Pátio Acadêmico
  placeCampusTree(832, 632, TV.flower[0], true);
  placeCampusTree(882, 632, TV.park[1], true);
  placeCampusTree(1162, 636, TV.flower[1], true);
  placeCampusTree(1228, 636, TV.park[2], true);

  // Árvores nas margens dos lagos, área verde oeste e entorno da Copa (fiéis à foto aérea)
  const scenicTrees = [
    [452, 1195, TV.forest[3]], [318, 1045, TV.park[2]], [195, 960, TV.pine[1]], [125, 1120, TV.forest[6]],
    [265, 1245, TV.park[1]], [395, 885, TV.park[0]], [1485, 595, TV.park[2]], [1455, 650, TV.flower[0]],
    [1495, 710, TV.park[1]], [1525, 860, TV.forest[2]], [1560, 965, TV.park[2]], [1625, 1055, TV.forest[8]],
    [1715, 1110, TV.pine[0]], [1460, 1225, TV.park[1]], [1535, 1275, TV.forest[4]], [1655, 455, TV.park[0]],
    [1735, 470, TV.park[2]], [1935, 535, TV.park[1]], [1995, 595, TV.forest[1]], [2035, 920, TV.park[0]],
    [2320, 900, TV.pine[1]], [2045, 315, TV.park[2]], [2295, 340, TV.forest[5]], [2335, 430, TV.park[1]]
  ];
  for (const [tx, ty, spr] of scenicTrees) {
    if (!LAKE_DEFS[0].inside(tx, ty, 6) && !LAKE_DEFS[1].inside(tx, ty, 6)) placeCampusTree(tx, ty, spr, true);
  }
  // Arbustos costeiros ao redor do Lago Principal
  for (let deg = -165; deg < 175; deg += 14) {
    if (deg > 152 || deg < -160) continue; // deixa livre a frente do píer
    const ang = deg * Math.PI / 180;
    const rad = polarR(LAKE_DEFS[0].keys, ang) + 10 + (R() * 10);
    const bx = Math.round(LAKE_DEFS[0].cx + Math.cos(ang) * rad);
    const by = Math.round(LAKE_DEFS[0].cy + Math.sin(ang) * rad);
    if (Math.abs(by - 742) < 24 && bx < 1580) continue;
    if (distToPolyline(bx, by, ROADS[1].pts) < 38 || distToPolyline(bx, by, ROADS[2].pts) < 36) continue;
    if (nearAnySolid(bx, by, 10)) continue;
    if (R() < 0.68) placeCampusTree(bx, by, TV.bush[Math.floor(R() * TV.bush.length)], false);
  }

  // 4) Carros Pixelados Estacionados (todos com colisão sólida AABB!)
  function placeParkedCar(cx, cy, quarter, colorIdx) {
    const col = CAR_COLORS[colorIdx % CAR_COLORS.length];
    const spr = getCar(col, quarter);
    bgx.save(); bgx.globalAlpha = 0.25;
    bgx.fillStyle = '#000'; bgx.fillRect(cx + 3, cy + 3, spr.width - 2, spr.height - 2);
    bgx.restore();
    SPRITES.push({ c: spr, x: cx, y: cy, sortY: cy + spr.height - 1 });
    addSolid(cx + 2, cy + 3, spr.width - 4, spr.height - 5, 'carro');
  }

  let ci = 0;
  // Fileira norte do Estacionamento Principal
  for (const slot of [0, 1, 3, 4, 5, 7, 9, 10, 12, 14, 15, 17, 19]) {
    placeParkedCar(723 + slot * 24, 1005, (slot % 3 === 0) ? 2 : 0, ci++);
  }
  // Fileiras centrais (acima e abaixo das ilhas arborizadas)
  for (const slot of [0, 2, 3, 5, 6]) placeParkedCar(797 + slot * 24, 1119, 2, ci++);
  for (const slot of [1, 2, 4, 6]) placeParkedCar(1013 + slot * 24, 1119, 0, ci++);
  for (const slot of [0, 1, 4, 5]) placeParkedCar(797 + slot * 24, 1185, 0, ci++);
  for (const slot of [0, 2, 3, 6]) placeParkedCar(1013 + slot * 24, 1185, 2, ci++);
  // Fileira sul (junto ao gradil)
  for (const slot of [1, 2, 4, 5, 6, 8, 11, 13, 16, 18]) {
    placeParkedCar(723 + slot * 24, 1314, (slot & 1) ? 0 : 2, ci++);
  }
  // Vagas oeste (horizontais, ao lado do abrigo azul)
  for (const slot of [0, 1, 4, 5]) placeParkedCar(507, 1142 + slot * 22, (slot & 1) ? 1 : 3, ci++);
  // Vagas leste ao longo da Avenida Interna (carros vermelho, branco, prata e azul visíveis na foto)
  const eastSlots = [[0, 8], [2, 0], [5, 9], [8, 3], [11, 1]];
  for (const [slot, cIdx] of eastSlots) placeParkedCar(1408, 826 + slot * 24, 3, cIdx);

  // Trator agrícola estacionado no pátio do Barracão/Garagem
  const [trC, trG] = makeCanvas(24, 20);

  rect(trG, 4, 5, 16, 10, '#16a34a'); rect(trG, 5, 6, 7, 8, '#dcfce7');
  rect(trG, 6, 7, 5, 6, '#334155'); rect(trG, 13, 6, 6, 8, '#15803d');
  rect(trG, 19, 8, 3, 4, '#facc15');
  addOuterOutline(trG, 24, 20, [18, 22, 20]);
  SPRITES.push({ c: trC, x: 248, y: 716, sortY: 735 });
  addSolid(250, 719, 20, 15, 'trator');

  // 5) Mobiliário Urbano: Postes de Luz, Bancos e Mesas com Guarda-sol na Copa
  const lamp = makeLamp(), bench = makeBench(), umb = makeUmbrellaTable();
  const lampCoords = [
    [1300, 440], [1300, 580], [1300, 720], [1300, 860], [1300, 1000], [1300, 1180], [1300, 1320],
    [1398, 440], [1398, 620], [1398, 780], [1398, 1180], [1398, 1320],
    [620, 390], [880, 390], [1160, 390], [1560, 390], [2060, 772], [2350, 772]
  ];
  for (const [lx, ly] of lampCoords) SPRITES.push({ c: lamp, x: lx - 4, y: ly - 30, sortY: ly });

  const benchCoords = [[760, 580], [928, 580], [1142, 600], [1495, 726], [1495, 764], [2060, 835], [2315, 835]];
  for (const [bx, by] of benchCoords) {
    SPRITES.push({ c: bench, x: bx, y: by, sortY: by + 9 });

  // Pré-ordena SPRITES por coordenada Y da base (profundidade 3/4)

const miniCanvas = document.getElementById('minimap');
const miniCtx = miniCanvas.getContext('2d');
const MINI_W = 210, MINI_H = 140;
miniCanvas.width = MINI_W; miniCanvas.height = MINI_H;
let miniBase = null;

function buildMinimap() {
  const [mc, mg] = makeCanvas(MINI_W, MINI_H);
  mg.imageSmoothingEnabled = true;
  mg.drawImage(bg, 0, 0, W, H, 0, 0, MINI_W, MINI_H);
  const sx = MINI_W / W, sy = MINI_H / H;
  for (const lk of LAKES) mg.drawImage(lk.frames[0], 0, 0, lk.w, lk.h, lk.x * sx, lk.y * sy, lk.w * sx, lk.h * sy);

  // Destaca cada prédio no minimapa para leitura imediata
  for (const loc of LOCATIONS) {
    for (const r of loc.rects) {
      mg.fillStyle = 'rgba(248,250,252,0.88)';
      mg.fillRect(r[0] * sx, r[1] * sy, Math.max(2, r[2] * sx), Math.max(2, r[3] * sy));
      mg.strokeStyle = '#10b981';
      mg.lineWidth = 0.8;
      mg.strokeRect(r[0] * sx, r[1] * sy, Math.max(2, r[2] * sx), Math.max(2, r[3] * sy));
    }
  }
  miniBase = mc;
}

function renderMinimap(cam, vw, vh, player, activeLocId, t) {
  if (!miniBase || miniWrap.style.display === 'none') return;
  miniCtx.clearRect(0, 0, MINI_W, MINI_H);
  miniCtx.drawImage(miniBase, 0, 0);
  const sx = MINI_W / W, sy = MINI_H / H;

  // Destaca prédio próximo
  if (activeLocId) {
    const loc = LOCATIONS.find(l => l.id === activeLocId);
    if (loc) {
      miniCtx.fillStyle = 'rgba(16,185,129,0.55)';
      for (const r of loc.rects) miniCtx.fillRect(r[0] * sx - 1, r[1] * sy - 1, r[2] * sx + 2, r[3] * sy + 2);
    }
  }

  // Retângulo da câmera atual
  miniCtx.strokeStyle = 'rgba(139,92,246,0.9)';
  miniCtx.lineWidth = 1.2;
  miniCtx.strokeRect(cam.x * sx, cam.y * sy, vw * sx, vh * sy);

  // Ponto pulsante do jogador
  const px = player.x * sx, py = player.y * sy;
  const pulse = 3.5 + Math.sin(t * 6) * 1.4;
  miniCtx.fillStyle = 'rgba(16,185,129,0.38)';
  miniCtx.beginPath(); miniCtx.arc(px, py, pulse + 2.5, 0, Math.PI * 2); miniCtx.fill();
  miniCtx.fillStyle = '#10b981';
  miniCtx.beginPath(); miniCtx.arc(px, py, 3, 0, Math.PI * 2); miniCtx.fill();
  miniCtx.fillStyle = '#ffffff';
  miniCtx.fillRect(px - 1, py - 1, 2, 2);
}

   11. MOTOR DE JOGO: JOGADOR, COLISÃO SLIDING AABB, CÂMERA LERP E UI

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const locBox = document.getElementById('location');
const locLabel = document.getElementById('loc-label');
const locName = document.getElementById('loc-name');
const coordsEl = document.getElementById('coords');
const interactEl = document.getElementById('interact');
const intName = document.getElementById('int-name');
const intDesc = document.getElementById('int-desc');
const btnHitbox = document.getElementById('btn-hitbox');
const btnRun = document.getElementById('btn-run');
const btnHelp = document.getElementById('btn-help');
const helpEl = document.getElementById('help');
const debugBadge = document.getElementById('debug-badge');
const miniWrap = document.getElementById('minimap-wrap');

let DPR = 1, screenW = window.innerWidth, screenH = window.innerHeight;
let zoom = window.innerWidth < 768 ? 2 : 2;
const ZOOM_STEPS = [1, 1.5, 2, 3, 4];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  screenW = window.innerWidth; screenH = window.innerHeight;
  canvas.width = Math.round(screenW * DPR);
  canvas.height = Math.round(screenH * DPR);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);

// Estado do jogador (spawn na entrada da Guarita / Pórtico, pista direita de acesso)
const player = {
  x: 1374, y: 1394,
  dir: 'up',
  frame: 0, animTimer: 0,
  moving: false, running: false,
  hbHalfW: 5, hbH: 7 // Hitbox nos pés: [x - 5, y - 7, 10, 7]
};
let PLAYER_FRAMES = null;

const cam = { x: player.x - 300, y: player.y - 200, init: false };
const keys = new Set();
let showHitboxes = false;
let runToggle = false;
let clickTarget = null; // {x, y, stuckTimer}
let pointerHeld = false, pointerScreen = { x: 0, y: 0 };

function toggleHitboxes() {
  showHitboxes = !showHitboxes;
  btnHitbox.classList.toggle('on', showHitboxes);
  debugBadge.classList.toggle('show', showHitboxes);
}
function toggleRun() {
  runToggle = !runToggle;
  btnRun.classList.toggle('on', runToggle);
  btnRun.classList.toggle('green', runToggle);
}
btnHitbox.addEventListener('click', toggleHitboxes);
btnRun.addEventListener('click', toggleRun);
btnHelp.addEventListener('click', () => helpEl.classList.toggle('hidden'));

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  keys.add(k);
  if (!e.repeat) {
    if (k === 'h' || k === 'c') toggleHitboxes();
    else if (k === 'm') miniWrap.style.display = (miniWrap.style.display === 'none') ? '' : 'none';
    else if (e.key === '+' || e.key === '=') {
      const idx = ZOOM_STEPS.findIndex(z => z >= zoom);
      zoom = ZOOM_STEPS[Math.min(ZOOM_STEPS.length - 1, (idx < 0 ? 2 : idx) + 1)];
    } else if (e.key === '-' || e.key === '_') {
      const idx = ZOOM_STEPS.findIndex(z => z >= zoom);
      zoom = ZOOM_STEPS[Math.max(0, (idx < 0 ? 2 : idx) - 1)];
    }
  }
});
window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => { keys.clear(); pointerHeld = false; });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const idx = ZOOM_STEPS.findIndex(z => z >= zoom);
  if (e.deltaY < 0) zoom = ZOOM_STEPS[Math.min(ZOOM_STEPS.length - 1, (idx < 0 ? 2 : idx) + 1)];
  else zoom = ZOOM_STEPS[Math.max(0, (idx < 0 ? 2 : idx) - 1)];
}, { passive: false });

function screenToWorld(clientX, clientY) {
  return { x: cam.x + clientX / zoom, y: cam.y + clientY / zoom };
}
canvas.addEventListener('pointerdown', (e) => {
  if (e.button !== undefined && e.button !== 0) return;
  pointerHeld = true;
  pointerScreen.x = e.clientX; pointerScreen.y = e.clientY;
  const wp = screenToWorld(e.clientX, e.clientY);
  clickTarget = { x: clamp(wp.x, 12, W - 12), y: clamp(wp.y, 14, H - 10), stuck: 0 };
});
window.addEventListener('pointermove', (e) => {
  if (!pointerHeld) return;
  pointerScreen.x = e.clientX; pointerScreen.y = e.clientY;
  const wp = screenToWorld(e.clientX, e.clientY);
  clickTarget = { x: clamp(wp.x, 12, W - 12), y: clamp(wp.y, 14, H - 10), stuck: 0 };
});
window.addEventListener('pointerup', () => { pointerHeld = false; });

// Clique no minimapa também move o personagem até o setor clicado
miniCanvas.addEventListener('pointerdown', (e) => {
  const r = miniCanvas.getBoundingClientRect();
  const mx = (e.clientX - r.left) / r.width * W;
  const my = (e.clientY - r.top) / r.height * H;
  clickTarget = { x: clamp(mx, 12, W - 12), y: clamp(my, 14, H - 10), stuck: 0 };
});

// Colisão AABB rigorosa com resolução separada nos eixos X e Y (deslizamento suave / sliding)
function moveWithCollision(dx, dy) {
  const hw = player.hbHalfW, hh = player.hbH;

  // Eixo X
  if (dx !== 0) {
    player.x += dx;
    for (let i = 0; i < SOLIDS.length; i++) {
      const s = SOLIDS[i];
      if (player.y > s.y && player.y - hh < s.y + s.h &&
          player.x + hw > s.x && player.x - hw < s.x + s.w) {
        if (dx > 0) player.x = s.x - hw;
        else player.x = s.x + s.w + hw;
      }
    }
  }
  // Eixo Y
  if (dy !== 0) {
    player.y += dy;
    for (let i = 0; i < SOLIDS.length; i++) {
      const s = SOLIDS[i];
      if (player.x + hw > s.x && player.x - hw < s.x + s.w &&
          player.y > s.y && player.y - hh < s.y + s.h) {
        if (dy > 0) player.y = s.y;
        else player.y = s.y + s.h + hh;
      }
    }
  }
  player.x = clamp(player.x, 8 + hw, W - 8 - hw);
  player.y = clamp(player.y, 8 + hh, H - 8);
}

// Verifica proximidade com portas e prédios para atualizar HUD e balão de descrição
let activeDoor = null;     // { loc, door: [x,y] }
let activeLocId = null;
let lastHudKey = '';

function updateProximity() {
  let bestDoor = null, bestDoorD = 48;
  let nearLoc = null, nearLocD = 68;

  for (const loc of LOCATIONS) {
    for (const dr of loc.doors) {
      const d = Math.hypot(player.x - dr[0], player.y - dr[1]);
      if (d < bestDoorD) { bestDoorD = d; bestDoor = { loc, door: dr }; }
      if (d < nearLocD) { nearLocD = d; nearLoc = loc; }
    }
    for (const r of loc.rects) {
      const d = rectDist(player.x, player.y, r);
      if (d < nearLocD) { nearLocD = d; nearLoc = loc; }
    }
  }

  activeDoor = bestDoor;
  activeLocId = bestDoor ? bestDoor.loc.id : (nearLoc ? nearLoc.id : null);

  if (bestDoor) {
    intName.textContent = bestDoor.loc.name;
    intDesc.textContent = bestDoor.loc.desc;
    interactEl.classList.add('show');
  } else {
    interactEl.classList.remove('show');
  }

  // Atualiza barra superior de localização
  let lbl = '', title = 'Caminhando pelo Campus', isNear = false;
  if (nearLoc) {
    lbl = 'Próximo a:'; title = nearLoc.name; isNear = true;
  } else if (LAKE_DEFS[0].inside(player.x, player.y, 34)) {
    lbl = 'Próximo a:'; title = 'Lago Principal'; isNear = true;
  } else if (LAKE_DEFS[1].inside(player.x, player.y, 28)) {
    lbl = 'Próximo a:'; title = 'Lago Menor'; isNear = true;
  } else if (player.y > roadTop(player.x) - 55) {
    lbl = 'Próximo a:'; title = 'Rodovia SC-135';
  } else {
    for (const z of ZONES) {
      if (rectDist(player.x, player.y, z.r) < 12) { lbl = 'Setor:'; title = z.name; break; }
    }
  }
  const hudKey = lbl + '|' + title + '|' + isNear;
  if (hudKey !== lastHudKey) {
    lastHudKey = hudKey;
    locLabel.textContent = lbl;
    locName.textContent = title;
    locBox.classList.toggle('near', isNear);
  }
  coordsEl.textContent = Math.round(player.x) + ' , ' + Math.round(player.y);
}

function update(dt) {
  let ix = 0, iy = 0;
  if (keys.has('w') || keys.has('arrowup')) iy -= 1;
  if (keys.has('s') || keys.has('arrowdown')) iy += 1;
  if (keys.has('a') || keys.has('arrowleft')) ix -= 1;
  if (keys.has('d') || keys.has('arrowright')) ix += 1;

  if (ix !== 0 || iy !== 0) {
    clickTarget = null; // teclado assume prioridade imediata
    const len = Math.hypot(ix, iy);
    ix /= len; iy /= len;
  } else if (clickTarget) {
    const dx = clickTarget.x - player.x, dy = clickTarget.y - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 4) {
      clickTarget = null;
    } else {
      ix = dx / dist; iy = dy / dist;
    }
  }

  player.running = keys.has('shift') || runToggle;
  const speed = player.running ? 205 : 118;
  player.moving = (ix !== 0 || iy !== 0);

  if (player.moving) {
    if (Math.abs(ix) > Math.abs(iy)) player.dir = ix > 0 ? 'right' : 'left';
    else player.dir = iy > 0 ? 'down' : 'up';

    const prevX = player.x, prevY = player.y;
    moveWithCollision(ix * speed * dt, iy * speed * dt);

    // Se estiver indo por clique e bater numa parede sem avançar, cancela suavemente
    if (clickTarget && !pointerHeld && Math.hypot(player.x - prevX, player.y - prevY) < 0.15) {
      clickTarget.stuck += dt;
      if (clickTarget.stuck > 0.25) clickTarget = null;
    }

    player.animTimer += dt * (player.running ? 11.5 : 7.5);
    player.frame = Math.floor(player.animTimer) & 3;
  } else {
    player.frame = 0;
    player.animTimer = 0;
  }

  // Câmera suave (lerp) centralizada no jogador e limitada às bordas do mapa
  const vw = Math.min(W, screenW / zoom), vh = Math.min(H, screenH / zoom);
  const targetX = clamp(player.x - vw / 2, 0, Math.max(0, W - vw));
  const targetY = clamp(player.y - vh / 2, 0, Math.max(0, H - vh));
  if (!cam.init) {
    cam.x = targetX; cam.y = targetY; cam.init = true;
  } else {
    const alpha = 1 - Math.exp(-9.5 * dt);
    cam.x += (targetX - cam.x) * alpha;
    cam.y += (targetY - cam.y) * alpha;
  }

  updateProximity();
}

function render(now) {
  const t = now * 0.001;
  const waterFrame = Math.floor(t * 3.2) & 3;

  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#0d0d12';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const scale = zoom * DPR;
  const vw = screenW / zoom, vh = screenH / zoom;
  // Arredonda câmera ao pixel da tela para evitar subpixel shimmer em pixel art
  const cx = Math.round(cam.x * scale) / scale;
  const cy = Math.round(cam.y * scale) / scale;

  ctx.save();
  ctx.scale(scale, scale);
  ctx.translate(-cx, -cy);

  // 1) Recorte visível do cenário base (grama, ruas, calçadas, sombras e fachadas)
  const sx0 = clamp(Math.floor(cx) - 2, 0, W), sy0 = clamp(Math.floor(cy) - 2, 0, H);
  const sw = clamp(Math.ceil(vw) + 4, 1, W - sx0), sh = clamp(Math.ceil(vh) + 4, 1, H - sy0);
  ctx.drawImage(bg, sx0, sy0, sw, sh, sx0, sy0, sw, sh);

  // 2) Água animada dos lagos + píer/vitórias-régias
  for (const lk of LAKES) {
    if (lk.x + lk.w < cx || lk.x > cx + vw || lk.y + lk.h < cy || lk.y > cy + vh) continue;
    ctx.drawImage(lk.frames[waterFrame], lk.x, lk.y);
  }
  for (const dec of DECOR) ctx.drawImage(dec.c, dec.x, dec.y);

  // 3) Marcador de destino do clique/toque no chão
  if (clickTarget) {
    const r = 4 + Math.sin(t * 8) * 1.5;
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = 1;
    ctx.strokeRect(Math.round(clickTarget.x - r), Math.round(clickTarget.y - r * 0.6), Math.round(r * 2), Math.round(r * 1.2));
  }

  // 4) Indicador discreto nas portas e destaque na porta ativa
  for (const loc of LOCATIONS) {
    for (const dr of loc.doors) {
      const isAct = activeDoor && activeDoor.door === dr;
      ctx.fillStyle = isAct ? 'rgba(16,185,129,0.55)' : 'rgba(16,185,129,0.22)';
      ctx.fillRect(dr[0] - 5, dr[1] - 1, 10, 3);
    }
  }

  // 5) Sprites ordenados por profundidade Y + Estudante intercalado na altura exata dos pés
  const px = Math.round(player.x), py = Math.round(player.y);
  let playerDrawn = false;
  const drawPlayerNow = () => {
    // Sombra oval nos pés do estudante
    ctx.fillStyle = 'rgba(0,0,0,0.32)';
    ctx.fillRect(px - 5, py - 2, 10, 3);
    ctx.fillRect(px - 4, py - 3, 8, 5);
    const spr = PLAYER_FRAMES[player.dir][player.frame];
    ctx.drawImage(spr, px - 8, py - 23);
    playerDrawn = true;
  };

  const viewL = cx - 60, viewR = cx + vw + 60, viewT = cy - 80, viewB = cy + vh + 60;
  for (let i = 0; i < SPRITES.length; i++) {
    const s = SPRITES[i];
    if (!playerDrawn && s.sortY >= py) drawPlayerNow();
    if (s.x + s.c.width < viewL || s.x > viewR || s.y + s.c.height < viewT || s.y > viewB) continue;
    ctx.drawImage(s.c, s.x, s.y);
  }
  if (!playerDrawn) drawPlayerNow();

  // 6) Coberturas superiores (Pórtico de Entrada arqueado sobre as pistas)
  for (const ov of OVERLAYS) ctx.drawImage(ov.c, ov.x, ov.y);

  // 7) Ícone flutuante de interação acima da porta ativa
  if (activeDoor) {
    const bob = Math.round(Math.sin(t * 5.5) * 2);
    const dx = activeDoor.door[0], dy = activeDoor.door[1] - 22 + bob;
    ctx.fillStyle = '#0d0d12';
    ctx.fillRect(dx - 5, dy - 6, 11, 10);
    ctx.fillStyle = '#10b981';
    ctx.fillRect(dx - 4, dy - 5, 9, 8);
    ctx.fillStyle = '#0d0d12';
    ctx.fillRect(dx, dy - 4, 1, 1);
    ctx.fillRect(dx, dy - 2, 1, 4);
  }

  // 8) Modo Debug: visualização de todas as Hitboxes de colisão AABB (tecla H ou C)
  if (showHitboxes) {
    ctx.lineWidth = 1;
    for (let i = 0; i < SOLIDS.length; i++) {
      const s = SOLIDS[i];
      if (s.x + s.w < viewL || s.x > viewR || s.y + s.h < viewT || s.y > viewB) continue;
      const isWater = s.tag === 'lago';
      ctx.fillStyle = isWater ? 'rgba(56,189,248,0.22)' : 'rgba(239,68,68,0.26)';
      ctx.strokeStyle = isWater ? 'rgba(56,189,248,0.85)' : 'rgba(248,113,113,0.92)';
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.strokeRect(s.x + 0.5, s.y + 0.5, Math.max(0, s.w - 1), Math.max(0, s.h - 1));
    }
    // Raios de interação das portas
    ctx.strokeStyle = 'rgba(16,185,129,0.75)';
    for (const loc of LOCATIONS) {
      for (const dr of loc.doors) {
        ctx.beginPath(); ctx.arc(dr[0], dr[1], 48, 0, Math.PI * 2); ctx.stroke();
      }
    }
    // Hitbox dos pés do jogador
    ctx.fillStyle = 'rgba(16,185,129,0.45)';
    ctx.strokeStyle = '#a7f3d0';
    ctx.fillRect(player.x - player.hbHalfW, player.y - player.hbH, player.hbHalfW * 2, player.hbH);
    ctx.strokeRect(player.x - player.hbHalfW, player.y - player.hbH, player.hbHalfW * 2, player.hbH);
  }

  ctx.restore(); // Fim do espaço do mundo; passa para espaço de tela nítido (DPR)

  // 9) Placas / Rótulos discretos flutuantes sobre cada prédio e setor
  ctx.save();
  ctx.scale(DPR, DPR);
  ctx.font = '600 10.5px Poppins, "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const floatBob = Math.sin(t * 2.2) * 1.8;

  for (const lb of WORLD_LABELS) {
    if (!lb.primary && zoom < 1.5) continue;
    const sx = (lb.x - cx) * zoom;
    const sy = (lb.y - cy) * zoom + (lb.primary ? floatBob : 0);
    if (sx < -90 || sx > screenW + 90 || sy < -30 || sy > screenH + 30) continue;

    const isHighlighted = lb.id === activeLocId;
    const padX = 7, boxH = 18;
    const tw = Math.ceil(ctx.measureText(lb.text).width);
    const boxW = tw + padX * 2 + (lb.primary ? 8 : 0);
    const bx = Math.round(sx - boxW / 2), by = Math.round(sy - boxH / 2);

    ctx.fillStyle = isHighlighted ? 'rgba(13, 24, 20, 0.92)' : 'rgba(13, 13, 18, 0.78)';
    ctx.strokeStyle = isHighlighted ? '#10b981' : (lb.primary ? 'rgba(139, 92, 246, 0.52)' : 'rgba(255,255,255,0.16)');
    ctx.lineWidth = isHighlighted ? 1.4 : 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, boxW, boxH, 5);
    else ctx.rect(bx, by, boxW, boxH);
    ctx.fill();
    ctx.stroke();

    if (lb.primary) {
      ctx.fillStyle = isHighlighted ? '#10b981' : '#8b5cf6';
      ctx.fillRect(bx + 6, by + 7, 4, 4);
    }
    ctx.fillStyle = isHighlighted ? '#ecfdf5' : (lb.primary ? '#f1f5f9' : '#cbd5e1');
    ctx.fillText(lb.text, sx + (lb.primary ? 4 : 0), by + boxH / 2 + 0.5);
  }
  ctx.restore();
  ctx.restore();

  renderMinimap(cam, vw, vh, player, activeLocId, t);
}

/* =========================================================================
   12. INICIALIZAÇÃO E LOOP PRINCIPAL (60 FPS)
   ========================================================================= */
function init() {
  resize();
  [bg, bgx] = makeCanvas(W, H);
  buildPatterns();
  drawTerrain();
  buildLakes();
  buildStructures();
  populateWorld();
  PLAYER_FRAMES = buildPlayerFrames();
  buildMinimap();
  updateProximity();

  // Oculta tela de carregamento e inicia o loop
  const loading = document.getElementById('loading');
  loading.classList.add('hide');
  setTimeout(() => loading.remove(), 450);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// Aguarda um frame para pintar a tela de loading antes de gerar a arte procedural
requestAnimationFrame(() => setTimeout(init, 30));
})();
</script>
